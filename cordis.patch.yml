# dsh-context-show bundle patch: mounts the context meter into a dsh profile.
#
# The host half registers the `contextUsage` session projection (per-provider
# usage attribution over the durable log, priced in the configured currency
# with peak / off-peak tiering); the web client half renders the draggable
# occupancy panel (compact / detailed) in the session header and a pricing
# settings card in the web Settings panel.
#
# Prices are per 1M tokens in `currency` (default CNY — DeepSeek bills in
# RMB). The base fields are the OFF-PEAK rate; `peak` overrides individual
# fields for samples inside `peakHours` (evaluated in `timeZone`, Beijing
# time). Resolution order per route:
#   modelPrices[provider/model] -> prices[provider] -> defaultPrice.
#
# CURRENT DeepSeek peak / off-peak rates, per
# https://api-docs.deepseek.com/zh-cn/quick_start/pricing/ :
#   Off-peak = half of peak. Peak hours (Beijing, MON-FRI only):
#   9:00-12:00, 14:00-18:00; weekends are all off-peak.
#   deepseek-flash (V4.1-Flash):
#                            cache hit 0.02 / cache miss 1 / output 4 (off-peak)
#                            cache hit 0.04 / cache miss 2 / output 8 (peak)
#   deepseek-v4-pro (V4-Pro-0813):
#                            cache hit 0.15 / cache miss 4.5 / output 13.5 (off-peak)
#                            cache hit 0.30 / cache miss 9.0 / output 27.0 (peak)
#   Legacy names deepseek-v4-flash / deepseek-v4-flash-vision-exp still call
#   through but are served by V4.1-Flash and bill at the Flash rates.
#
# priceUrls is display metadata only: a pricing-page link is shown ONLY for
# providers listed there (no pricing API exists for DeepSeek; OpenRouter is
# the notable exception). defaultPriceUrl is the reference page of the
# fallback rate and is deliberately NOT attached to unlisted providers, so a
# gateway route (e.g. conntek) never renders DeepSeek's page as its own.
# Update the numbers here or in Settings when the provider changes its rates.
#
# Install: `dsh plugin --profile <name> add <this package>` (npm or a local
# path). The `dsh plugin` command pnpm-installs the package into the profile
# and reconciles it into the profile's `dsh.profile.bundles` layer list.
- insert:
    - id: context-show
      name: dsh-context-show
      config:
        # Currency code of the prices below (ISO 4217 style).
        currency: CNY
        # Peak-hour windows, 24h [start, end) in timeZone (Beijing time).
        peakHours:
          - { start: 9, end: 12 }
          - { start: 14, end: 18 }
        timeZone: Asia/Shanghai
        # Provider-keyed prices; base = off-peak, peak = peak-hour overrides.
        prices:
          deepseek-official:
            inputPerM: 1
            cacheReadPerM: 0.02
            cacheWritePerM: 1
            outputPerM: 4
            peak:
              inputPerM: 2
              cacheReadPerM: 0.04
              cacheWritePerM: 2
              outputPerM: 8
        # Model-level overrides, keyed `provider/model`.
        modelPrices:
          deepseek-official/deepseek-flash:
            inputPerM: 1
            cacheReadPerM: 0.02
            cacheWritePerM: 1
            outputPerM: 4
            peak:
              inputPerM: 2
              cacheReadPerM: 0.04
              cacheWritePerM: 2
              outputPerM: 8
          deepseek-official/deepseek-v4-flash:
            inputPerM: 1
            cacheReadPerM: 0.02
            cacheWritePerM: 1
            outputPerM: 4
            peak:
              inputPerM: 2
              cacheReadPerM: 0.04
              cacheWritePerM: 2
              outputPerM: 8
          deepseek-official/deepseek-v4-flash-vision-exp:
            inputPerM: 1
            cacheReadPerM: 0.02
            cacheWritePerM: 1
            outputPerM: 4
            peak:
              inputPerM: 2
              cacheReadPerM: 0.04
              cacheWritePerM: 2
              outputPerM: 8
          deepseek-official/deepseek-v4-pro:
            inputPerM: 4.5
            cacheReadPerM: 0.15
            cacheWritePerM: 4.5
            outputPerM: 13.5
            peak:
              inputPerM: 9
              cacheReadPerM: 0.3
              cacheWritePerM: 9
              outputPerM: 27
        # Fallback for any provider/model without a matching entry above.
        defaultPrice:
          inputPerM: 1
          cacheReadPerM: 0.02
          cacheWritePerM: 1
          outputPerM: 4
          peak:
            inputPerM: 2
            cacheReadPerM: 0.04
            cacheWritePerM: 2
            outputPerM: 8
        # Official pricing pages shown as links in the cost section.
        priceUrls:
          deepseek-official: https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
        defaultPriceUrl: https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
